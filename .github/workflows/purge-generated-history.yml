name: Purge generated history

on:
  push:
    branches:
      - main
    paths:
      - .purge-trigger

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite repository history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -m pip install --quiet git-filter-repo
          git clone --bare "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo.git
          cd repo.git
          git filter-repo --force --path output/ --path review_outputs/ --invert-paths
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push origin --force --all
          git push origin --force --tags

      - name: Remove one-shot files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" clean
          cd clean
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/purge-generated-history.yml .purge-trigger
          git add -A
          git commit -m "chore: remove one-shot history purge files"
          git push origin main
